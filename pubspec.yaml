name: word_bulldog
description: Personalized English vocabulary learning app with adaptive difficulty
version: 1.0.0+1
publish_to: 'none'

environment:
  # Dart 3.5 достаточно для Flutter 3.27
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management (Используем стабильную ветку 2.x для совместимости с Dart 3.6)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database (Isar)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Navigation
  go_router: ^14.2.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Network
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Semantic Search
  tflite_flutter: ^0.11.0

  # Utils
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0

  # Security
  flutter_secure_storage: ^9.2.2

  # Analytics
  firebase_core: ^3.3.0
  firebase_analytics: ^11.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation (Версии 2.x совместимы с Dart 3.6)
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4
  
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/bulldog_splash.png
    - assets/images/bulldog_icon.png
    - assets/images/bulldog_onboarding.png
    - assets/lottie/
    - assets/word_database/
    - assets/models/embedding/v1/model.tflite
    - assets/models/embedding/v1/tokenizer.json
    - assets/models/embedding/v1/metadata.json

  # Исправлена структура fonts (было дублирование ключа fonts)
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700

name: word_bulldog
description: Personalized English vocabulary learning app with adaptive difficulty
version: 1.0.0+1
publish_to: 'none' # Рекомендуется для приватных проектов

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.2"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  # flutter_riverpod: ^2.5.1
  # riverpod_annotation: ^2.3.5
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Local Database (⚠️ Оставьте ТОЛЬКО одну: Isar ИЛИ Hive)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  # hive: ^2.2.3
  # hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.2.0

  # UI Components
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Network
  dio: ^5.5.0
  connectivity_plus: ^6.0.3

  # Semantic Search (on-device ML)
  tflite_flutter: ^0.11.0
  # tflite_flutter_helper удалён (см. рекомендации ниже)

  # Utils
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.2
  logger: ^2.4.0

  # Security
  flutter_secure_storage: ^9.2.2

  # Analytics (optional)
  firebase_core: ^3.3.0
  firebase_analytics: ^11.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11
  # riverpod_generator: ^2.4.3
  riverpod_generator: ^3.0.0
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/bulldog_splash.png
    - assets/images/bulldog_icon.png
    - assets/images/bulldog_onboarding.png
    - assets/lottie/
    - assets/word_database/
    - assets/models/embedding/v1/model.tflite
    - assets/models/embedding/v1/tokenizer.json
    - assets/models/embedding/v1/metadata.json
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700

name: Android CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Clean & Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Patch isar_flutter_libs for AGP 8
        run: |
          echo "🔧 Patching isar_flutter_libs for AGP 8..."
          ISAR_PATH=$(find "$PUB_CACHE/hosted/pub.dev" -maxdepth 1 -name "isar_flutter_libs-*" -type d | head -n 1)
          if [ -z "$ISAR_PATH" ]; then echo "❌ isar_flutter_libs not found!"; exit 1; fi
          
          BUILD_GRADLE="$ISAR_PATH/android/build.gradle"
          if ! grep -q "namespace" "$BUILD_GRADLE"; then
            # Добавляем namespace внутрь android { } блока
            sed -i '/^android {/a\    namespace "dev.isar.isar_flutter_libs"' "$BUILD_GRADLE"
            echo "✅ Patched namespace in isar_flutter_libs"
          else
            echo "✅ namespace already present"
          fi

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK & AppBundle
        run: |
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
